<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Score final combinando afinidad RIASEC y cercanía, con deduplicación y ranking sin tope">
<style>
  text { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  .titulo   { font-size: 19px; font-weight: 600; fill: #1f2933; }
  .etiqueta { font-size: 14px; fill: #52606d; }
  .dato     { font-size: 15px; font-weight: 600; fill: #1f2933; }
  .pie      { font-size: 12px; fill: #7b8794; }
  .codigo   { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 13px; fill: #1c5cab; }
</style>
<rect width="900" height="430" fill="#ffffff"/>
<defs>
  <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/>
  </marker>
  <marker id="flecha-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/>
  </marker>
  <marker id="flecha-naranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/>
  </marker>
</defs>
<text x="40.0" y="46.0" class="titulo" text-anchor="start">Un solo score decide el orden</text>
<text x="40.0" y="68.0" class="pie" text-anchor="start">El estudiante mueve el peso de la cercanía con un slider; acá vale 0.3</text>
<rect x="40.0" y="92.0" width="820.0" height="52.0" rx="10" fill="#f5f7fa" stroke="#d9e2ec"/>
<text x="60.0" y="124.0" class="codigo" text-anchor="start" style="font-size:16px">score_final = (1 − 0.3) × similitud_riasec + 0.3 × score_cercanía</text>
<text x="40.0" y="178.0" class="dato" text-anchor="start">Misma carrera, dos sedes</text>
<text x="470.0" y="178.0" class="pie" text-anchor="middle">afinidad RIASEC</text>
<text x="618.0" y="178.0" class="pie" text-anchor="middle">cercanía</text>
<text x="768.0" y="178.0" class="pie" text-anchor="middle">score final</text>
<rect x="40.0" y="200.0" width="820.0" height="50.0" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
<text x="60.0" y="222.0" class="dato" text-anchor="start">Laboratorio Clínico</text>
<text x="60.0" y="240.0" class="pie" text-anchor="start">ULEAM · Manta</text>
<rect x="412.0" y="228.0" width="116.0" height="10" rx="5.0" fill="#f5f7fa" stroke="#d9e2ec"/>
<rect x="412.0" y="228.0" width="108.7" height="10" rx="5.0" fill="#2a78d6"/>
<text x="470.0" y="220.0" class="dato" text-anchor="middle">0.937</text>
<rect x="560.0" y="228.0" width="116.0" height="10" rx="5.0" fill="#f5f7fa" stroke="#d9e2ec"/>
<rect x="560.0" y="228.0" width="116.0" height="10" rx="5.0" fill="#eb6834"/>
<text x="618.0" y="220.0" class="dato" text-anchor="middle">1.000</text>
<text x="768.0" y="222.0" class="dato" text-anchor="middle" style="font-size:21px;fill:#0d366b">0.956</text>
<text x="768.0" y="241.0" class="pie" text-anchor="middle">sede en el mismo cantón</text>
<rect x="40.0" y="262.0" width="820.0" height="50.0" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
<text x="60.0" y="284.0" class="dato" text-anchor="start">Laboratorio Clínico</text>
<text x="60.0" y="302.0" class="pie" text-anchor="start">U. Central · Quito</text>
<rect x="412.0" y="290.0" width="116.0" height="10" rx="5.0" fill="#f5f7fa" stroke="#d9e2ec"/>
<rect x="412.0" y="290.0" width="108.7" height="10" rx="5.0" fill="#2a78d6"/>
<text x="470.0" y="282.0" class="dato" text-anchor="middle">0.937</text>
<rect x="560.0" y="290.0" width="116.0" height="10" rx="5.0" fill="#f5f7fa" stroke="#d9e2ec"/>
<rect x="560.0" y="290.0" width="86.1" height="10" rx="5.0" fill="#eb6834"/>
<text x="618.0" y="282.0" class="dato" text-anchor="middle">0.742</text>
<text x="768.0" y="284.0" class="dato" text-anchor="middle" style="font-size:21px;fill:#0d366b">0.879</text>
<text x="768.0" y="303.0" class="pie" text-anchor="middle">misma afinidad, 274 km</text>
<rect x="40.0" y="336.0" width="400.0" height="78.0" rx="10" fill="#f5f7fa" stroke="#d9e2ec"/>
<text x="60.0" y="364.0" class="dato" text-anchor="start">Deduplicación</text>
<text x="60.0" y="386.0" class="etiqueta" text-anchor="start">drop_duplicates sobre (carrera, IES):</text>
<text x="60.0" y="404.0" class="pie" text-anchor="start">una carrera no se repite por sede duplicada.</text>
<rect x="460.0" y="336.0" width="400.0" height="78.0" rx="10" fill="#f5f7fa" stroke="#d9e2ec"/>
<text x="480.0" y="364.0" class="dato" text-anchor="start">Sin tope</text>
<text x="480.0" y="386.0" class="etiqueta" text-anchor="start">buscar() devuelve las 2464 del pool filtrado;</text>
<text x="480.0" y="404.0" class="pie" text-anchor="start">el frontend decide cuántas mostrar.</text>
</svg>
