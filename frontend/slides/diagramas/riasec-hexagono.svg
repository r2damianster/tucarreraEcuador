<rect x="584.0" y="177.0" width="57.0" height="14" rx="7.0" fill="#2a78d6"/>
<text x="788.0" y="189.0" class="dato" text-anchor="start">0.3</text>
<text x="562.0" y="215.0" class="dato" text-anchor="start">S</text>
<rect x="584.0" y="203.0" width="190.0" height="14" rx="7.0" fill="#ffffff" stroke="#d9e2ec"/>
<rect x="584.0" y="203.0" width="114.0" height="14" rx="7.0" fill="#2a78d6"/>
<text x="788.0" y="215.0" class="dato" text-anchor="start">0.6</text>
<text x="562.0" y="241.0" class="dato" text-anchor="start">E</text>
<rect x="584.0" y="229.0" width="190.0" height="14" rx="7.0" fill="#ffffff" stroke="#d9e2ec"/>
<rect x="584.0" y="229.0" width="38.0" height="14" rx="7.0" fill="#2a78d6"/>
<text x="788.0" y="241.0" class="dato" text-anchor="start">0.2</text>
<text x="562.0" y="267.0" class="dato" text-anchor="start">C</text>
<rect x="584.0" y="255.0" width="190.0" height="14" rx="7.0" fill="#ffffff" stroke="#d9e2ec"/>
<rect x="584.0" y="255.0" width="57.0" height="14" rx="7.0" fill="#2a78d6"/>
