<circle cx="250.0" cy="144.0" r="24" fill="#2a78d6"/>
<text x="250.0" y="151.0" text-anchor="middle" style="font-size:19px;font-weight:700;fill:#ffffff">R</text>
<text x="250.0" y="98.0" class="dato" text-anchor="middle">Realista</text>
<text x="250.0" y="114.0" class="pie" text-anchor="middle">manos, máquinas</text>
<circle cx="338.3" cy="195.0" r="24" fill="#2a78d6"/>
<text x="338.3" y="202.0" text-anchor="middle" style="font-size:19px;font-weight:700;fill:#ffffff">I</text>
<text x="372.3" y="193.0" class="dato" text-anchor="start">Investigativo</text>
<text x="372.3" y="211.0" class="pie" text-anchor="start">analizar, resolver</text>
<circle cx="338.3" cy="297.0" r="24" fill="#2a78d6"/>
<text x="338.3" y="304.0" text-anchor="middle" style="font-size:19px;font-weight:700;fill:#ffffff">A</text>
<text x="372.3" y="295.0" class="dato" text-anchor="start">Artístico</text>
<text x="372.3" y="313.0" class="pie" text-anchor="start">crear, expresar</text>
<circle cx="250.0" cy="348.0" r="24" fill="#2a78d6"/>
<text x="250.0" y="355.0" text-anchor="middle" style="font-size:19px;font-weight:700;fill:#ffffff">S</text>
<text x="250.0" y="396.0" class="dato" text-anchor="middle">Social</text>
<text x="250.0" y="413.0" class="pie" text-anchor="middle">ayudar, enseñar</text>
<circle cx="161.7" cy="297.0" r="24" fill="#2a78d6"/>
<text x="161.7" y="304.0" text-anchor="middle" style="font-size:19px;font-weight:700;fill:#ffffff">E</text>
<text x="127.7" y="295.0" class="dato" text-anchor="end">Emprendedor</text>
<text x="127.7" y="313.0" class="pie" text-anchor="end">liderar, negociar</text>
<circle cx="161.7" cy="195.0" r="24" fill="#2a78d6"/>
<text x="161.7" y="202.0" text-anchor="middle" style="font-size:19px;font-weight:700;fill:#ffffff">C</text>
<text x="127.7" y="193.0" class="dato" text-anchor="end">Convencional</text>
<text x="127.7" y="211.0" class="pie" text-anchor="end">ordenar, procesar</text>
<rect x="542.0" y="50.0" width="318.0" height="250.0" rx="10" fill="#f5f7fa" stroke="#d9e2ec"/>
<text x="562.0" y="78.0" class="titulo" text-anchor="start">Un perfil = 6 números</text>
<text x="562.0" y="98.0" class="pie" text-anchor="start">60 ítems sí/no · 10 por dimensión</text>
<text x="562.0" y="137.0" class="dato" text-anchor="start">R</text>
<rect x="584.0" y="125.0" width="190.0" height="14" rx="7.0" fill="#ffffff" stroke="#d9e2ec"/>
